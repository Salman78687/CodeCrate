services:
  # The API. It starts sandbox containers through the host's Docker socket.
  api:
    build: .
    volumes:
      # Read the security notes in the README: access to this socket is
      # equivalent to root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CODECRATE_CORS_ORIGINS: ${CODECRATE_CORS_ORIGINS:-http://localhost:3000}
      CODECRATE_TIMEOUT: ${CODECRATE_TIMEOUT:-15}
      CODECRATE_MEMORY: ${CODECRATE_MEMORY:-256m}
      CODECRATE_CPUS: ${CODECRATE_CPUS:-0.5}
      CODECRATE_MAX_CONCURRENT: ${CODECRATE_MAX_CONCURRENT:-4}
    ports:
      # Bound to localhost only; the web app reaches the API through nginx
      - "127.0.0.1:8000:8000"
    depends_on:
      go-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # The web app (nginx serves the React build and proxies /api to the API)
  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # Builds the Go sandbox image (codecrate-go:1.23) and exits
  go-image:
    build: ./sandbox/go
    image: codecrate-go:1.23
    command: ["true"]
    network_mode: none
