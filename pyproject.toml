[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codecrate"
version = "0.2.0"
description = "Run code in many languages inside isolated, resource-limited Docker containers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Salman Javed" }]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "docker==7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "flake8==7.5.0",
]

[project.urls]
Repository = "https://github.com/Salman78687/CodeCrate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
