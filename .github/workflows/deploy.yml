name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CodeCrate
            # Debug: Show system information
            echo "System Information:"
            uname -a
            # Debug: Show Docker installation
            echo "Docker Installation:"
            which docker
            docker --version
            # Stop Docker service
            echo "Stopping Docker service..."
            sudo systemctl stop docker
            sudo systemctl stop docker.socket
            # Remove Docker socket if it exists
            echo "Removing Docker socket..."
            sudo rm -f /var/run/docker.sock
            # Configure Docker daemon
            echo "Configuring Docker daemon..."
            sudo mkdir -p /etc/docker
            sudo tee /etc/docker/daemon.json << EOF
            {
              "hosts": ["unix:///var/run/docker.sock", "tcp://0.0.0.0:2375"],
              "log-driver": "json-file",
              "log-opts": {
                "max-size": "100m",
                "max-file": "3"
              },
              "debug": true
            }
            EOF
            # Update Docker service configuration
            echo "Updating Docker service configuration..."
            sudo mkdir -p /etc/systemd/system/docker.service.d
            sudo tee /etc/systemd/system/docker.service.d/override.conf << EOF
            [Service]
            ExecStart=
            ExecStart=/usr/bin/dockerd
            EOF
            # Remove any existing socket configuration
            sudo rm -f /etc/systemd/system/docker.socket
            # Reload systemd and restart Docker
            echo "Reloading systemd and restarting Docker..."
            sudo systemctl daemon-reload
            sudo systemctl start docker
            # Wait for Docker to be ready
            echo "Waiting for Docker to be ready..."
            timeout=60
            while ! sudo docker info > /dev/null 2>&1; do
              if [ $timeout -le 0 ]; then
                echo "Timeout waiting for Docker to start"
                sudo journalctl -u docker --no-pager
                exit 1
              fi
              timeout=$((timeout-1))
              sleep 1
            done
            # Debug: Show Docker info
            echo "Docker Info:"
            sudo docker info
            # Add current user to docker group
            echo "Adding user to docker group..."
            sudo usermod -aG docker $USER
            # Debug: Show what's using port 8000
            echo "Checking processes using port 8000..."
            sudo lsof -i :8000 || true
            # Stop all running containers
            echo "Stopping containers..."
            sudo docker-compose down || true
            # Kill any process using port 8000
            echo "Killing processes on port 8000..."
            sudo fuser -k 8000/tcp || true
            # Clean up Docker
            echo "Cleaning up Docker..."
            sudo docker system prune -f || true
            sudo docker rm -f $(sudo docker ps -aq) 2>/dev/null || true
            sudo docker network prune -f || true
            sudo docker volume prune -f || true
            # Clean up prometheus directory
            echo "Setting up Prometheus..."
            sudo rm -rf prometheus
            mkdir -p prometheus
            # Create prometheus config
            cat > prometheus/prometheus.yml << 'EOL'
            global:
              scrape_interval: 15s
              evaluation_interval: 15s

            scrape_configs:
              - job_name: 'api'
                static_configs:
                  - targets: ['api:8000']
                metrics_path: '/metrics'

              - job_name: 'prometheus'
                static_configs:
                  - targets: ['localhost:9090']
            EOL
            # Set proper permissions
            sudo chown -R $USER:$USER prometheus
            # Pull latest changes
            echo "Pulling latest changes..."
            git pull
            # Build and start services
            echo "Building Docker images..."
            sudo docker-compose build || { echo "Docker build failed"; exit 1; }
            echo "Starting Docker containers..."
            sudo docker-compose up -d || { echo "Docker compose up failed"; exit 1; }
            # Verify services
            echo "Verifying services..."
            sudo docker-compose ps
            # Show logs
            echo "Container logs:"
            sudo docker-compose logs 