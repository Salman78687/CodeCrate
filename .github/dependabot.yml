version: 2

# Checked monthly. Minor and patch updates of each kind are grouped into a
# single pull request; major upgrades still arrive one per pull request,
# since they usually need code changes.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories: ["/", "/frontend", "/sandbox/go"]
    schedule:
      interval: monthly
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]
